services:
  - type: web
    name: schednova-backend
    runtime: python
    plan: free
    region: oregon

    # Build & start
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    # Health check path (FastAPI's default docs endpoint)
    healthCheckPath: /docs

    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard (keep secret)

      - key: SECRET_KEY
        sync: false          # Set manually in Render dashboard (keep secret)

      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-app.vercel.app

      - key: GOOGLE_CLIENT_ID
        sync: false          # Optional – Google OAuth client ID

      - key: PYTHON_VERSION
        value: "3.11.0"

      - key: DB_SSLMODE
        value: require
